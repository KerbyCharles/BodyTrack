<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro | BodyTrack</title>
    <link rel="stylesheet" href="css/output.css">
</head>
<body class="min-h-screen bg-slate-100 flex items-center justify-center p-4">
    <main class="w-full max-w-md bg-white p-6  rounded-2xl shadow-lg">
        <h1 class="text-2xl font-bold text-clinical-900 text-center">Crie sua conta</h1>
        <p class="text-sm text-slate-500 text-center mt-2">Cadastra-se para acompanhar sua evolução corporal.</p>

        <form id="formCadastro" class="mt-6 flex flex-col gap-4 ">
            <div class="flex flex-col gap-3">
                <label for="nome" class="block  font-medium">Nome completo</label>
                <input type="text" 
                id ="nome" 
                name="nome" 
                placeholder=" Nome completo"
                required
                class="w-full p-3 border border-slate-300 rounded-lg outline-none focus:ring-2 focus:ring-clinical-500 focus:border-clinical-500
                transition">
            </div>
            <div class="flex flex-col gap-3">
                <label for="email" class="block  font-medium">E-mail</label>
                <input type="email"
                id="email"
                name="email"
                placeholder=" nome@gmail.com"
                required
                class="w-full p-3 border border-slate-300 rounded-lg outline-none focus:ring-2 focus:ring-clinical-500 focus:border-clinical-500
                transition">
            </div>
            <div class="flex flex-col gap-3">
                <label for="senha" class="block  font-medium">Senha</label>
                <input type="password"
                id="senha"
                name="senha"
                placeholder=" Digite sua senha"
                required
                minlength="6"
                class="w-full p-3 border border-slate-300 rounded-lg outline-none focus:ring-2 focus:ring-clinical-500 focus:border-clinical-500
                transition">
            </div>
            <div class="flex flex-col gap-3">
                <label for="confirmarSenha" class="block  font-medium">Confirme a senha</label>
                <input type="password"
                id="confirmarSenha"
                name="confirmarSenha"
                placeholder=" Repita a mesma senha"
                required
                minlength="6"
                class="w-full p-3 border border-slate-300 rounded-lg outline-none focus:ring-2 focus:ring-clinical-500 focus:border-clinical-500
                transition">
            </div>
            <div class="flex flex-col gap-3">
                <label for="dataNascimento" class="block  font-medium">Digite sua data de nascimento</label>
                <input type="date"
                id="dataNascimento"
                name="dataNascimento"
                required
                class="w-full p-3 border border-slate-300 rounded-lg outline-none focus:ring-2 focus:ring-clinical-500 focus:border-clinical-500
                transition">
            </div>
            <div class="flex flex-col gap-3">
                <label for="altura" class="block  font-medium">Digite sua altura</label>
                <input type="number"
                id="altura"
                name="altura"
                placeholder=" 1.90"
                required
                step="0.01"
                min="0.50"
                max="2.50"
                class="w-full p-3 border border-slate-300 rounded-lg outline-none focus:ring-2 focus:ring-clinical-500 focus:border-clinical-500
                transition">
            </div>
            <button type="submit"
            class="cadastro w-full bg-clinical-900 text-white font-semibold rounded-lg px-6 py- hover:bg-clinical-700 transition duration-300">Cadastra-se</button>
        </form>
    </main>
    <script src="js/cadastro.js"defer></script>
</body>
</html>
